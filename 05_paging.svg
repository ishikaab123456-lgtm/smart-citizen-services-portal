<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#117a75"/></marker></defs>
  <style>.title{font:700 28px Arial;fill:#102a43}.node-text{font:600 17px Arial;fill:#233445}.edge-label{font:600 14px Arial;fill:#65788a}</style>
  <rect width="1200" height="700" fill="#ffffff"/><text x="600" y="42" text-anchor="middle" class="title">Paging and Address Translation</text><line x1="330" y1="325" x2="470" y2="325" stroke="#117a75" stroke-width="3" marker-end="url(#arrow)"/><text x="400" y="317" text-anchor="middle" class="edge-label">page-table lookup</text><line x1="730" y1="325" x2="870" y2="325" stroke="#117a75" stroke-width="3" marker-end="url(#arrow)"/><text x="800" y="317" text-anchor="middle" class="edge-label">frame + offset</text><g><rect x="70" y="250" width="260" height="150" rx="14" fill="#eaf3f9" stroke="#1f5f8b" stroke-width="2.5"/><text x="200" y="289" text-anchor="middle" class="node-text">LOGICAL ADDRESS</text><text x="200" y="313" text-anchor="middle" class="node-text">Page number | Offset</text><text x="200" y="337" text-anchor="middle" class="node-text"></text><text x="200" y="361" text-anchor="middle" class="node-text">Example: Page 2, Offset 40</text></g><g><rect x="470" y="180" width="260" height="290" rx="14" fill="#fff4d8" stroke="#d28a08" stroke-width="2.5"/><text x="600" y="277" text-anchor="middle" class="node-text">PAGE TABLE</text><text x="600" y="301" text-anchor="middle" class="node-text">P0 → Frame 2</text><text x="600" y="325" text-anchor="middle" class="node-text">P1 → Frame 0</text><text x="600" y="349" text-anchor="middle" class="node-text">P2 → Frame 3</text><text x="600" y="373" text-anchor="middle" class="node-text">P3 → Frame 1</text></g><g><rect x="870" y="170" width="270" height="310" rx="14" fill="#e8f5f3" stroke="#117a75" stroke-width="2.5"/><text x="1005" y="277" text-anchor="middle" class="node-text">PHYSICAL MEMORY</text><text x="1005" y="301" text-anchor="middle" class="node-text">Frame 0: Certificate</text><text x="1005" y="325" text-anchor="middle" class="node-text">Frame 1: Payment</text><text x="1005" y="349" text-anchor="middle" class="node-text">Frame 2: Login</text><text x="1005" y="373" text-anchor="middle" class="node-text">Frame 3: Grievance</text></g></svg>